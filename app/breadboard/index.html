<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breadboard Layout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>⚡ Breadboard Layout</h1>
  <span class="subtitle" id="circuit-title">Loading...</span>
</header>

<div class="toolbar">
  <button id="btn-select" class="active" title="Select / Inspect mode">🔍 Inspect</button>
  <button id="btn-move" title="Drag components to reposition">✋ Move</button>
  <button id="btn-wire" title="Draw horizontal wires">🔌 Wire</button>
  <button id="btn-bridge" title="Add bridge wires between rows">🌉 Bridge</button>
  <div class="sep"></div>
  <button id="btn-delete" title="Delete wire/bridge under cursor">🗑️ Delete</button>
  <div class="sep"></div>
  <button id="btn-save" title="Save layout to .bb file">💾 Save</button>
  <button id="btn-load" title="Reload layout from .bb file">📂 Reload</button>
  <div class="sep"></div>
  <span class="status" id="status-bar">Ready</span>
</div>

<div class="canvas-wrap" id="canvas-wrap">
  <canvas id="board"></canvas>
  <div id="tooltip"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#aaa"></div> Connected (grey)</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#3060cc"></div> Disconnected (blue)</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#ff2020"></div> Conflict (red)</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#f0c040"></div> Highlighted net</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#40a0ff"></div> Wire</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#ff8040"></div> Bridge</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#8f8"></div> Dragging</div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
